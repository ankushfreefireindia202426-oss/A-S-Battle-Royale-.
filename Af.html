<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS Battle Royale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b2fd4">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AS Battle">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f0720;--card:#1a1038;--ln:#2d1f55;--pu:#5b2fd4;--go:#f5a623;--tx:#f4f0ff;--mu:#a79cc9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;max-width:520px;margin:auto;padding:0 14px 110px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--ln);margin-bottom:14px}
.top h2{margin:0;font-size:19px;flex:1}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--ln);color:var(--tx);font-size:18px}
.pill{background:var(--card);border:1px solid var(--go);color:var(--go);border-radius:22px;padding:8px 14px;font-weight:700}
.card{background:linear-gradient(135deg,#241352,#1a1038);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:#2a1d52;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--go),#ff7a18)}
.hero{background:linear-gradient(120deg,#3a1d9e,#a02bd6 60%,#f5a623);border-radius:18px;padding:18px;margin-bottom:14px}
.hero b{font-size:24px;display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{background:#0a0416;border:1px solid var(--ln);border-radius:16px;padding:12px 6px;text-align:center;font-weight:700;font-size:12px;position:relative;min-height:96px;color:var(--tx)}
.m span{display:block;font-size:34px}.m em{position:absolute;top:6px;right:6px;font-style:normal;background:#241a40;border-radius:10px;padding:1px 7px;font-size:11px}
.m em:before{content:"● ";color:#3fb950}
.btn{background:linear-gradient(#ffb02e,#f08a00);color:#2a1500;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px}
.btn.w{width:100%}.btn.pu{background:var(--pu);color:#fff}
input,select{width:100%;background:#0a0416;border:1px solid var(--ln);border-radius:10px;padding:12px;color:var(--tx);font:inherit;margin:5px 0}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:12px 0;font-weight:700}
.tabs button.on{color:var(--tx);border-color:var(--go)}
.t{padding:0;overflow:hidden}.t .ph{height:110px;background:linear-gradient(120deg,#6b2bd9,#c0392b 70%,#f5a623);padding:12px;font-weight:800;font-size:19px}
.t .bd{padding:14px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.st div{background:#150b30;border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center}.st small{display:block;color:var(--mu);font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#1a1038;border-top:1px solid var(--ln);display:flex;justify-content:space-around;z-index:5}
.nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button b{font-size:21px;font-weight:400}.nav button.on{color:var(--go)}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.ch button{background:#0a0416;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:9px 14px}.ch button.on{background:var(--pu);border-color:var(--pu)}
.qr{background:#fff;padding:8px;border-radius:10px;width:max-content;margin:8px 0}
.hide{display:none}a{color:var(--go)}
.car{overflow:hidden;border-radius:18px;margin-bottom:8px}.trk{display:flex;transition:transform .6s ease}.sl{min-width:100%;display:flex}.sl .hero{margin:0;width:100%}
.cl{display:block;text-align:center;color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:10px;margin-top:8px}
.dt{width:8px;height:8px;border-radius:8px;background:#3a2d66;transition:all .3s}.dt.on{width:22px;background:var(--go)}
.th{position:relative;height:130px;border-radius:12px;margin-top:8px;overflow:hidden;background:linear-gradient(135deg,#6b2bd9,#c0392b)}.th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pl{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#f00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.m span{width:62px;height:62px;margin:2px auto 6px;border-radius:50%;border:3px solid var(--go);border-right-color:transparent;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(#3a2a00,#0a0416)}
.nav button:nth-child(3){margin-top:-36px;color:var(--go);font-weight:700}
.hb{display:flex;width:64px;height:64px;border-radius:50%;background:var(--pu);border:4px solid var(--go);align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:2px}
.fab{position:fixed;right:18px;bottom:100px;width:56px;height:56px;border-radius:50%;background:linear-gradient(#ff9a1f,#f06a00);border:0;font-size:26px;z-index:4}
.bdg{display:inline-block;border:1px solid var(--go);color:var(--go);border-radius:18px;padding:3px 10px;font-size:12px;font-weight:700;background:#0008}
.idp{border:1px solid var(--go);color:var(--go);border-radius:10px;padding:3px 10px;font-size:12px}
.note{border:1px solid var(--ln);border-radius:12px;padding:10px;color:var(--mu);font-size:13px;margin:10px 0}
.t .ph{height:135px}
.lf{display:flex;align-items:center;gap:8px;background:#1a1038;border:1px solid var(--ln);border-radius:16px;padding:0 14px;margin-top:6px}.lf input{border:0;background:none;margin:0;padding:16px 0}.lf button{background:none;border:0;color:var(--mu);font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="ov hide"></div>
<script>
const UPI="7763969981@mbk",PIN="425263";
const MODES=[["PER KILL","🔫",36],["SURVIVAL","🏝️",5],["UMP ONLY","🐰",51],["ONE TAP ONLY","🎯",47],["LW HEAD","🥊",47],["CS HEAD","👹",45],["CS 1 VS 1","🤡",48],["LW 1 VS 1","🐇",69],["CS 10Rs","💚",38]];
let S={users:{},me:null,reqs:[],wds:[],rooms:{},cnt:{},admin:false};
try{const x=localStorage.getItem("ffb");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("ffb",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const U=()=>S.users[S.me];
let v="home",mode=null,tt="UPCOMING",amt=0,timer=null,need=0;
function seed(){return MODES.flatMap(m=>{const pk=m[0]==="PER KILL"?10:0;return[{id:m[0]+"1",m:m[0],t:m[0]+" BOOYAH 100",entry:50,prize:1100,pk,type:"Solo",map:"Bermuda",time:"Today · 7:00 PM",tot:32,base:1},{id:m[0]+"2",m:m[0],t:m[0]+" QUICK 10",entry:10,prize:220,pk,type:"Squad",map:"Kalahari",time:"Today · 9:00 PM",tot:48,base:3}]})}
function tours(m){if(!S.matches)S.matches=seed();return S.matches.filter(t=>t.m===m)}
function oldTours(m){const pk=m==="PER KILL"?10:0;return[
 {id:m+"1",t:m+" BOOYAH 100",entry:50,prize:1100,pk,type:"Solo",map:"Bermuda",time:"Today · 7:00 PM",tot:32,base:1},
 {id:m+"2",t:m+" QUICK 10",entry:10,prize:220,pk,type:"Squad",map:"Kalahari",time:"Today · 9:00 PM",tot:48,base:3}]}
function go(x,m){v=x;if(m!==undefined)mode=m;render();scrollTo(0,0)}
function modal(h){$("ov").innerHTML=`<div class="sh">${h}</div>`;$("ov").classList.remove("hide")}
function close(){$("ov").classList.add("hide")}
window.alert=t=>modal(`<p>${esc(t)}</p><button class="btn w" onclick="close()">ठीक है</button>`);
$("ov").onclick=e=>{if(e.target.id==="ov")close()};

function login(){const n=$("ln").value.trim(),p=$("lp").value;if(n.length<3||p.length<4)return alert("नाम (3+) और पासवर्ड (4+ अक्षर) डालो।");
 const u=S.users[n];if(u&&u.p!==p)return alert("पासवर्ड गलत है।");
 if(!u)S.users[n]={p,coins:0,xp:5,streak:1,joined:{},tx:[],last:""};
 S.me=n;v="home";render()}
function logout(){S.me=null;S.admin=false;render()}

function join(id,entry,title){const u=U();
 if(u.joined[id])return alert("तुम पहले से जुड़े हो।");
 if(u.coins<entry){need=entry-u.coins;return modal(`<h3>कॉइन कम हैं</h3><p class="mu">इस टूर्नामेंट की एंट्री 🪙 ${entry} है। तुम्हारे पास 🪙 ${u.coins} हैं। ${need} कॉइन और चाहिए।</p><button class="btn w" onclick="close();go('wallet')">➕ कॉइन जोड़ो</button><button class="btn w pu" style="margin-top:8px" onclick="close()">बाद में</button>`)}
 modal(`<h3>${esc(title)}</h3><p class="mu">एंट्री फीस 🪙 ${entry} कटेगी। जुड़ना है?</p><button class="btn w" onclick="doJoin('${id}',${entry},'${esc(title)}')">JOIN · 🪙 ${entry}</button>`)}
function doJoin(id,entry,title){const u=U();u.coins-=entry;u.joined[id]=title;u.xp+=10;S.cnt[id]=(S.cnt[id]||0)+1;u.tx.push(`−${entry} कॉइन · ${title}`);close();save();render()}

function pick(a){amt=a;$("pay").classList.remove("hide");$("pa").textContent=a;$("pu").textContent=UPI;
 const u=`upi://pay?pa=${UPI}&am=${a}&cu=INR&tn=${encodeURIComponent("Coins "+S.me)}`;$("pl").href=u;$("qr").innerHTML="";
 try{new QRCode($("qr"),{text:u,width:170,height:170})}catch(e){}
 clearInterval(timer);let s=60;$("cd").textContent=s;timer=setInterval(()=>{s--;$("cd").textContent=s;if(s<=0){clearInterval(timer);$("pay").classList.add("hide")}},1000);
 document.querySelectorAll("#amts button").forEach(b=>b.classList.toggle("on",+b.dataset.a===a))}
function paid(){S.reqs.push({user:S.me,amt});clearInterval(timer);amt=0;save();alert("रिक्वेस्ट भेज दी। आयोजक के कन्फर्म करने पर कॉइन जुड़ेंगे।");render()}
function ok(i){const r=S.reqs.splice(i,1)[0],u=S.users[r.user];if(u){u.coins+=r.amt;u.tx.push(`+${r.amt} कॉइन जुड़े`)}save();render()}
function no(i){S.reqs.splice(i,1);save();render()}
function adm(){if(S.admin){S.admin=false;return render()}modal(`<h3>आयोजक PIN</h3><input id="pin" type="password" inputmode="numeric" placeholder="PIN डालो"><button class="btn w" onclick="chk()">खोलो</button>`)}
function chk(){if($("pin").value===PIN){S.admin=true;close();v="wallet";render()}else{$("pin").value="";$("pin").placeholder="गलत PIN, फिर कोशिश करो"}}
function adminView(){return head("Admin Panel")+matchAdmin()+`<div class="card"><h3>➕ Add Money Requests</h3>${S.reqs.length?S.reqs.map((r,i)=>`<div style="margin:10px 0"><b>${esc(r.user)} — ₹${r.amt}</b><button class="btn w" style="margin-top:6px" onclick="ok(${i})">✅ पेमेंट आया, कॉइन जोड़ो</button><button class="btn w pu" style="margin-top:6px" onclick="no(${i})">✕ रिजेक्ट</button></div>`).join(""):`<span class="mu">कोई रिक्वेस्ट नहीं।</span>`}</div><div class="card"><h3>💸 Withdraw Requests</h3>${S.wds.length?S.wds.map((w,i)=>`<div style="margin:10px 0"><b>${esc(w.user)} — 🪙 ${w.c} (₹${w.c})</b><div class="mu">UPI: ${esc(w.upi)}</div><button class="btn w" style="margin-top:6px" onclick="wdOk(${i})">✅ पेमेंट कर दिया</button><button class="btn w pu" style="margin-top:6px" onclick="wdNo(${i})">✕ रिजेक्ट (कॉइन वापस)</button></div>`).join(""):`<span class="mu">कोई रिक्वेस्ट नहीं।</span>`}</div>`}
function wd(){const u=U(),c=+$("wc").value,p=$("wu").value.trim();if(c<25)return alert("कम से कम 25 कॉइन चाहिए।");if(c>u.coins)return alert("इतने कॉइन नहीं हैं।");if(!p)return alert("UPI ID डालो।");u.coins-=c;S.wds.push({user:S.me,c,upi:p});u.tx.push(`−${c} कॉइन विथड्रॉ रिक्वेस्ट`);save();alert("विथड्रॉ रिक्वेस्ट भेज दी गई।");render()}
function wdOk(i){S.wds.splice(i,1);save();render()}
function wdNo(i){const w=S.wds.splice(i,1)[0],u=S.users[w.user];if(u){u.coins+=w.c;u.tx.push(`+${w.c} कॉइन वापस (विथड्रॉ रिजेक्ट)`)}save();render()}
let reg=false;
function eye(){const e=$("lp");e.type=e.type==="password"?"text":"password"}
function loginView(){return `<div style="text-align:center;padding-top:50px"><div style="width:110px;height:110px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--go);background:#1a1038;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:var(--go)">AS</div><div style="color:#ff7a00;font-size:30px;font-weight:800">AS BATTLE ROYALE</div><h1 style="margin:6px 0;font-size:32px">${reg?"Create account":"Welcome back"}</h1><p class="mu" style="margin:18px 0 24px">${reg?"Register to join tournaments and track your winnings.":"Log in to join tournaments and track your winnings."}</p></div><div class="mu">Username</div><div class="lf"><span>👤</span><input id="ln" autocomplete="username"></div><div class="mu" style="margin-top:12px">Password</div><div class="lf"><span>🔒</span><input id="lp" type="password" autocomplete="current-password"><button type="button" onclick="eye()">👁</button></div><div style="text-align:right;margin:10px 0"><a href="#" onclick="alert('पासवर्ड भूल गए? आयोजक से संपर्क करो।');return false" style="color:#ff7a00">Forgot password?</a></div><button class="btn w pu" style="padding:16px;font-size:18px" onclick="login2()">${reg?"Register":"Log In"}</button><p class="mu" style="text-align:center;margin-top:22px">${reg?"Already have an account?":"Don’t have an account?"} <a href="#" onclick="reg=!reg;render();return false" style="color:#ff7a00">${reg?"Log In":"Register"}</a></p>`}
function login2(){const n=$("ln").value.trim(),p=$("lp").value;
if(n==="admin"&&p===PIN){S.me="admin";S.users.admin=S.users.admin||{p:PIN,coins:0,xp:0,streak:0,joined:{},tx:[],last:""};S.admin=true;v="wallet";return render()}
if(n.length<3||p.length<4)return alert("यूज़रनेम (3+) और पासवर्ड (4+ अक्षर) डालो।");const u=S.users[n];
if(reg){if(u)return alert("यह यूज़रनेम पहले से है।");S.users[n]={p,coins:0,xp:5,streak:1,joined:{},tx:[],last:""}}else{if(!u)return alert("अकाउंट नहीं मिला। पहले Register करो।");if(u.p!==p)return alert("पासवर्ड गलत है।")}
S.me=n;v="home";render()}
function roomBox(id){const r=S.rooms[id];return `<div class="note" style="border-color:var(--go);color:var(--tx)">🔑 ${r&&r.i?`Room ID: <b>${esc(r.i)}</b> · Password: <b>${esc(r.p||"-")}</b>`:"Room ID और पासवर्ड जल्द आएगा"}</div>`}
function roomAdmin(){const L=MODES.flatMap(m=>tours(m[0]).map(t=>({m:m[0],...t})));return `<div class="card"><h3>🔑 Room ID &amp; Password (सभी मैच)</h3><div class="mu">हर मैच के लिए डालो, फिर नीचे सेव दबाओ। जुड़े हुए खिलाड़ियों को दिखेगा।</div>${L.map(t=>{const r=S.rooms[t.id]||{};return `<div style="margin:12px 0;padding-top:10px;border-top:1px solid var(--ln)"><b>${esc(t.m)}</b> · ${esc(t.t)}<div class="mu">${t.time} · ${t.map}</div><div style="display:flex;gap:8px"><input class="rm" data-k="${esc(t.id)}" data-f="i" placeholder="Room ID" value="${esc(r.i||"")}"><input class="rm" data-k="${esc(t.id)}" data-f="p" placeholder="Password" value="${esc(r.p||"")}"></div></div>`}).join("")}<button class="btn w" onclick="saveRooms()">💾 सब सेव करो</button></div>`}
function support(){modal(`<h3>🤖 हमसे जुड़ो</h3><p class="mu">हमारे WhatsApp ग्रुप और YouTube चैनल से जुड़ो। अपडेट, रूम ID और मैच की जानकारी वहीं मिलेगी।</p><a href="https://chat.whatsapp.com/FeCQEYYn0irDcsxeLzOlub?s=cl&p=a&iam=2" target="_blank" rel="noopener" class="btn" style="display:block;text-align:center;text-decoration:none;color:#fff;background:#25d366">💬 WhatsApp ग्रुप जॉइन करो</a><a href="https://youtube.com/@dengerous_yt_100k?feature=shared" target="_blank" rel="noopener" class="btn" style="display:block;text-align:center;text-decoration:none;color:#fff;background:#ff0000;margin-top:8px">▶️ YouTube चैनल Subscribe करो</a>`)}
let ci=0;
setInterval(()=>{const t=document.getElementById("trk");if(!t)return;ci=(ci+1)%3;t.style.transform=`translateX(-${ci*100}%)`;[0,1,2].forEach(k=>{const d=document.getElementById("d"+k);if(d)d.classList.toggle("on",k===ci)})},10000);
function fmt(a){return new Date(a).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true})}
function fi(id,l,type,val){return `<label class="mu" style="display:block;margin-top:6px">${l}</label><input id="${id}" type="${type}" value="${esc(val)}">`}
function matchAdmin(){if(!S.matches)S.matches=seed();const A=S.matches;
return `<div class="card"><h3>➕ नया मैच जोड़ो</h3><label class="mu">मोड</label><select id="nm">${MODES.map(m=>`<option>${m[0]}</option>`).join("")}</select>${fi("nt","मैच का नाम","text","")}${fi("na","तारीख और समय","datetime-local","")}${fi("ne","Entry Fee (कॉइन)","number","")}${fi("np","Prize Pool (कुल इनाम)","number","")}${fi("nk","Per Kill (कॉइन)","number","0")}${fi("nmap","Map","text","Bermuda")}<label class="mu" style="display:block;margin-top:6px">Type</label><select id="ny"><option>Solo</option><option>Duo</option><option>Squad</option><option>Clash Squad</option></select>${fi("nsp","कुल स्पॉट","number","32")}<button class="btn w" style="margin-top:10px" onclick="newMatch()">मैच जोड़ो</button></div>

function newMatch(){const g=id=>$(id).value,t=g("nt").trim();if(!t)return alert("मैच का नाम डालो।");const a=g("na");S.matches.push({id:"m"+Date.now(),m:g("nm"),t,at:a,time:a?fmt(a):"जल्द बताया जाएगा",entry:+g("ne")||0,prize:+g("np")||0,pk:+g("nk")||0,type:g("ny"),map:g("nmap")||"Bermuda",tot:+g("nsp")||32,base:0});save();alert("मैच जुड़ गया।");render()}
function saveMatch(i){const t=S.matches[i],g=id=>$(id+i).value;t.t=g("et").trim()||t.t;const a=g("ea");if(a){t.at=a;t.time=fmt(a)}t.entry=+g("ee")||0;t.prize=+g("ep")||0;t.pk=+g("ek")||0;t.tot=+g("es")||t.tot;t.map=g("em").trim()||t.map;S.rooms[t.id]={i:g("ei").trim(),p:g("ew").trim()};save();alert("सेव हो गया।")}
function delMatch(i){modal(`<h3>मैच हटाओ?</h3><p class="mu">${esc(S.matches[i].t)}</p><button class="btn w" onclick="delOk(${i})">हाँ, हटाओ</button>`)}
function delOk(i){S.matches.splice(i,1);close();save();render()}
function saveRooms(){document.querySelectorAll(".rm").forEach(e=>{const k=e.dataset.k;(S.rooms[k]=S.rooms[k]||{})[e.dataset.f]=e.value.trim()});save();alert("रूम ID और पासवर्ड सेव हो गए।")}
